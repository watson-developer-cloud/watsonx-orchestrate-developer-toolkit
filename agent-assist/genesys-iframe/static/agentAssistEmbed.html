<html>
    <head>
        <title>Agent Assist Embedded Chat</title>
        <meta charset="UTF-8" />

        <style>
            body,
            html {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
            }

            .root-container {
                background-color: #ffffff;
                background-image: linear-gradient(to bottom, white 0%, white 50%, transparent 50%, rgba(69, 137, 255, 0.1) 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
            }

            .loader-container {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                width: 100%;
                height: 100%;
            }

            .loader {
                border: 10px solid #f3f3f3;
                border-top: 10px solid #3498db;
                border-radius: 50%;
                width: 70px;
                height: 70px;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .loader-text {
                color: #161616;
                font-family: 'IBM Plex Sans';
                font-size: 28px;
                margin-top: 20px;
            }

            .error-container {
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                align-items: flex-start;
                padding: 28px 20px 30px;
                box-sizing: border-box;
            }

            .error-icon {
                width: 120px;
                height: 120px;
                opacity: 0.4;
                margin-bottom: 24px;
            }

            .title {
                font-size: 28px;
                color: #161616;
                margin-bottom: 10px;
            }

            .subtitle {
                font-size: 16px;
                color: #525252;
                margin-bottom: 20px;
            }

            .retry-btn {
                padding: 10px 20px;
                display: inline-flex;
                gap: 8px;
                align-items: center;
                height: 30px;
                border-radius: 32px;
                border: 1px solid var(--Button-button-tertiary, #0f62fe);
                background: var(--Transparent, rgba(255, 255, 255, 0));
                background-blend-mode: multiply;
                color: var(--Button-button-tertiary, #0f62fe);
                font-family: var(--Fixed-Body-Font-family, 'IBM Plex Sans');
                font-size: 14px;
                font-style: normal;
                font-weight: 400;
                line-height: 18px;
                letter-spacing: 0.16px;
                cursor: pointer;
            }

            .retry-btn:hover {
                background: rgba(45, 108, 255, 0.1);
            }

            .retry-btn svg {
                width: 18px;
                height: 18px;
            }
        </style>

                <div class="loader-container">

                    <div class="loader-text">Initializing Agent Assist...</div>

                        }

                if (retryBtn) {
                    retryBtn.onclick = () => {
                        renderLoader();
                        initChat?.();
                    };
                }

            // Parses URL query params into a config object.
            function getQueryParams() {
                const agentAssistParams = {
                    orchestrationID: parameters.get('orchestrationID'),
                    agentId: parameters.get('agentId'),
                    conversationId: parameters.get('conversationId'),
                    local: parameters.get('local') === 'true',
                };

                if (parameters.has('agentEnvironmentId')) {
                    agentAssistParams.agentEnvironmentId = parameters.get('agentEnvironmentId');
                }

                // Extract contact center config parameters (cc_config.*).
                const contactCenterConfig = {};
                parameters.entries().forEach(([key, value]) => {
                    if (key.startsWith('cc_config.')) {
                        const configKey = key.substring('cc_config.'.length);
                        contactCenterConfig[configKey] = value;
                    }
                });

                agentAssistParams.contactCenterConfig = contactCenterConfig;

                return agentAssistParams;
            }

            function onChatLoad(instance) {
                hideLoader();

                instance.on('authTokenNeeded', () => {
                    root().innerHTML = `
                        <div class="loader-container">
                            <div class="loader-text">Embed security is enabled. Access to the dashboard is restricted.</div>
                        </div>
                    `;
                });
            }

            /**
             * Initializes chat: validates context, loads config, subscribes,
             * loads embed script, and boots chat.
             */
            async function initChat(token) {
                console.log(`${debugLabel} Initializing chat`);

                showLoader();

                const queryParameters = getQueryParams();

                const missing = Object.values(queryParameters).some((parameter) => !parameter && typeof parameter !== 'boolean');
                if (missing) {
                    return showError(
                        'Unable to connect to Agent Assist',
                        'Missing required configuration parameters. Please check the url.'
                    );
                }

                // Note that the dashboard may only be loaded from the same origin that's hosting this html file. This is to avoid
                // someone injecting a malicious host via a url parameter.
                const hostURL = window.location.origin;

                window.wxOConfiguration = {
                    orchestrationID: queryParameters.orchestrationID,
                    hostURL,
                    rootElementId: 'root',
                    chatOptions: {
                        agentId: queryParameters.agentId,
                        agentEnvironmentId: queryParameters.agentEnvironmentId,
                        onLoad: onChatLoad,
                    },
                    layout: {
                        form: 'agent-assist',
                    },
                    launcher: {
                        showLauncher: false,
                        openByDefault: true,
                    },
                    header: {
                        showMinimize: false,
                    },
                    agentAssist: {
                        conversationId: queryParameters.conversationId,
                        contactCenterConfig: queryParameters.contactCenterConfig,
                    },
                    token,
                };

                let path;

                if (queryParameters.local) {
                    path = `/wxoLoader.js?embed=true`;
                } else {
                    path = `/wxochat/wxoLoader.js?embed=true`;
                }

                const script = document.createElement('script');
                script.src = `${hostURL}${path}`;

                script.onload = () => {
                    if (!window.wxoLoader) {
                        return showError('Initialization Error', 'Chat loader not found.', true);
                    }
                    window.wxoLoader.init();
                };

                script.onerror = () => showError('Loading Error', 'Failed to load chat script.', true);

                document.head.appendChild(script);
            }

            document.addEventListener('DOMContentLoaded', () => {
                if (parameters.get('waitForAuth') === 'true') {
                    // We actually need to wait for authentication to complete before loading. Add a listener to receive the auth
                    // information and let the parent frame know we're waiting.
                    window.addEventListener('message', (event) => {
                        console.log(`${debugLabel} Got event`, event);
                        if (event.data?.type === 'wxOAgentAssist:configLoaded') {
                            initChat(event.data?.config?.jwt);
                        }
                    });
                    window.postMessage('wxOAgentAssist:waitingForAuth');
                } else {
                    initChat();
                }
            });
        </script>
